[project]
name = "agentproof"
version = "0.1.0"
description = "Regression testing for customer-facing AI agents."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Alielson Ferreira Pequeno", email = "alielson_pequeno@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.4.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
]

[project.scripts]
agentproof = "agentproof.cli:app"
agentproof-mcp = "agentproof.mcp_server:main"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused imports, undefined names),
# I: import order, B: common bug patterns, UP: modern Python syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the example agent in examples/, which is not installed
pythonpath = ["."]
addopts = "-ra"
